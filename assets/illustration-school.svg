<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-label="Illustration of a therapist working alongside a child at a desk in a classroom">
  <!-- Flat brand illustration - school desk session. Palette matches the page tokens. -->
  <rect width="900" height="600" rx="16" fill="#ffffff"/>
  <path d="M0 16 A16 16 0 0 1 16 0 H884 A16 16 0 0 1 900 16 V400 H0 Z" fill="#E7EEF1"/>
  <path d="M0 400 H900 V584 A16 16 0 0 1 884 600 H16 A16 16 0 0 1 0 584 Z" fill="#F5F1E8"/>
  <rect x="0" y="394" width="900" height="10" fill="#DCE6EA"/>
  <!-- pinboard -->
  <rect x="70" y="62" width="230" height="168" rx="8" fill="#C0906A"/>
  <rect x="84" y="76" width="202" height="140" rx="4" fill="#FAF7F2"/>
  <rect x="100" y="94" width="56" height="42" rx="3" fill="#3E6B80" transform="rotate(-4 100 94)"/>
  <rect x="176" y="92" width="48" height="56" rx="3" fill="#D9A441" transform="rotate(3 176 92)"/>
  <path d="M120 168 l22 -30 22 30 Z" fill="#C9764F"/>
  <rect x="182" y="164" width="60" height="36" rx="3" fill="#294E62" transform="rotate(-3 182 164)"/>
  <!-- window -->
  <rect x="628" y="52" width="212" height="222" rx="10" fill="#294E62"/>
  <rect x="644" y="68" width="180" height="190" rx="4" fill="#F6FBFD"/>
  <rect x="729" y="68" width="10" height="190" fill="#294E62"/>
  <rect x="644" y="158" width="180" height="10" fill="#294E62"/>
  <!-- bookshelf under the window -->
  <rect x="636" y="298" width="196" height="84" rx="6" fill="#C0906A"/>
  <rect x="650" y="310" width="14" height="60" rx="2" fill="#294E62"/>
  <rect x="668" y="316" width="14" height="54" rx="2" fill="#D9A441"/>
  <rect x="686" y="308" width="14" height="62" rx="2" fill="#C9764F"/>
  <rect x="704" y="318" width="14" height="52" rx="2" fill="#3E6B80"/>
  <rect x="722" y="312" width="14" height="58" rx="2" fill="#537D8F"/>
  <rect x="748" y="322" width="66" height="48" rx="4" fill="#E7EEF1"/>
  <!-- child seated at the desk, head bent toward the work -->
  <circle cx="392" cy="302" r="32" fill="#E8B48C"/>
  <path d="M360 302 a32 32 0 0 1 64 0 Z" fill="#4A3728"/>
  <path d="M390 268 q2 -10 10 -12" stroke="#4A3728" stroke-width="7" stroke-linecap="round" fill="none"/>
  <circle cx="386" cy="308" r="4" fill="#23201C"/>
  <circle cx="403" cy="308" r="4" fill="#23201C"/>
  <path d="M388 320 q7 6 14 0" stroke="#23201C" stroke-width="3" stroke-linecap="round" fill="none"/>
  <rect x="352" y="330" width="80" height="70" rx="28" fill="#C9764F"/>
  <!-- child's arm to the paper -->
  <rect x="400" y="356" width="64" height="20" rx="10" fill="#C9764F" transform="rotate(18 400 356)"/>
  <circle cx="462" cy="382" r="10" fill="#E8B48C"/>
  <!-- adult therapist beside the child, leaning in -->
  <circle cx="548" cy="266" r="40" fill="#C68B62"/>
  <path d="M508 266 a40 40 0 0 1 80 0 Z" fill="#2E2620"/>
  <circle cx="586" cy="234" r="12" fill="#2E2620"/>
  <circle cx="540" cy="270" r="4.5" fill="#23201C"/>
  <circle cx="522" cy="270" r="4.5" fill="#23201C"/>
  <path d="M524 284 q9 7 18 0" stroke="#23201C" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M498 400 q0 -96 52 -96 q50 0 50 96 Z" fill="#294E62"/>
  <!-- adult's arm guiding, pointing at the paper -->
  <rect x="452" y="344" width="88" height="24" rx="12" fill="#294E62" transform="rotate(24 452 344)"/>
  <circle cx="452" cy="386" r="12" fill="#C68B62"/>
  <!-- desk -->
  <rect x="262" y="398" width="392" height="24" rx="8" fill="#C0906A"/>
  <rect x="282" y="422" width="18" height="120" rx="4" fill="#A87A56"/>
  <rect x="616" y="422" width="18" height="120" rx="4" fill="#A87A56"/>
  <!-- chair hints -->
  <rect x="352" y="440" width="14" height="100" rx="4" fill="#3E6B80"/>
  <rect x="428" y="440" width="14" height="100" rx="4" fill="#3E6B80"/>
  <rect x="348" y="432" width="98" height="14" rx="6" fill="#3E6B80"/>
  <!-- work on the desk: paper, pencil, shape tiles -->
  <g transform="rotate(-4 430 402)">
    <rect x="398" y="386" width="72" height="24" rx="3" fill="#ffffff" stroke="#DCE6EA" stroke-width="3"/>
  </g>
  <rect x="486" y="392" width="52" height="9" rx="4.5" fill="#D9A441" transform="rotate(-8 486 392)"/>
  <path d="M540 385 l12 3 -10 7 Z" fill="#4A3728"/>
  <rect x="308" y="388" width="20" height="20" rx="3" fill="#294E62" transform="rotate(8 308 388)"/>
  <rect x="336" y="386" width="20" height="20" rx="3" fill="#C9764F" transform="rotate(-6 336 386)"/>
</svg>
