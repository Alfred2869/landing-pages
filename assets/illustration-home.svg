<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-label="Illustration of a therapist and a young child playing with blocks together on the floor at home">
  <!-- Flat brand illustration - home floor session. Palette matches the page tokens. -->
  <rect width="900" height="600" rx="16" fill="#ffffff"/>
  <!-- wall and floor -->
  <path d="M0 16 A16 16 0 0 1 16 0 H884 A16 16 0 0 1 900 16 V380 H0 Z" fill="#E7EEF1"/>
  <path d="M0 380 H900 V584 A16 16 0 0 1 884 600 H16 A16 16 0 0 1 0 584 Z" fill="#F5F1E8"/>
  <rect x="0" y="374" width="900" height="10" fill="#DCE6EA"/>
  <!-- window -->
  <rect x="96" y="64" width="210" height="236" rx="10" fill="#264B5D"/>
  <rect x="112" y="80" width="178" height="204" rx="4" fill="#F6FBFD"/>
  <rect x="196" y="80" width="10" height="204" fill="#264B5D"/>
  <rect x="112" y="176" width="178" height="10" fill="#264B5D"/>
  <rect x="84" y="300" width="234" height="14" rx="7" fill="#3E6B80"/>
  <!-- curtain -->
  <path d="M318 58 q26 60 8 130 q-14 60 6 118 h34 V58 Z" fill="#3E6B80" opacity="0.9"/>
  <!-- plant -->
  <ellipse cx="790" cy="252" rx="16" ry="46" fill="#3E6B80"/>
  <ellipse cx="762" cy="272" rx="14" ry="38" fill="#537D8F" transform="rotate(-18 762 272)"/>
  <ellipse cx="818" cy="272" rx="14" ry="38" fill="#537D8F" transform="rotate(18 818 272)"/>
  <path d="M756 300 h68 l-10 62 h-48 Z" fill="#C9764F"/>
  <!-- picture on wall -->
  <rect x="520" y="96" width="120" height="88" rx="8" fill="#FAF7F2" stroke="#DCE6EA" stroke-width="4"/>
  <circle cx="556" cy="132" r="14" fill="#D9A441"/>
  <path d="M532 168 l30 -26 22 16 26 -22 20 32 Z" fill="#3E6B80"/>
  <!-- rug -->
  <ellipse cx="460" cy="482" rx="310" ry="88" fill="#E7EEF1"/>
  <ellipse cx="460" cy="482" rx="250" ry="66" fill="none" stroke="#D3E0E6" stroke-width="6"/>
  <!-- adult therapist, seated cross-legged, facing the child -->
  <ellipse cx="340" cy="478" rx="86" ry="34" fill="#35596B"/>
  <rect x="288" y="342" width="106" height="130" rx="44" fill="#264B5D"/>
  <!-- arm reaching toward the blocks -->
  <rect x="368" y="398" width="86" height="26" rx="13" fill="#264B5D" transform="rotate(14 368 398)"/>
  <circle cx="452" cy="440" r="13" fill="#E8B48C"/>
  <!-- head -->
  <circle cx="341" cy="298" r="42" fill="#E8B48C"/>
  <path d="M299 298 a42 42 0 0 1 84 0 Z" fill="#4A3728"/>
  <circle cx="302" cy="264" r="14" fill="#4A3728"/>
  <circle cx="352" cy="300" r="4.5" fill="#23201C"/>
  <circle cx="372" cy="300" r="4.5" fill="#23201C"/>
  <path d="M354 316 q10 8 20 0" stroke="#23201C" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <!-- child, seated, facing the adult -->
  <ellipse cx="575" cy="486" rx="62" ry="26" fill="#B58530"/>
  <rect x="534" y="390" width="82" height="98" rx="34" fill="#D9A441"/>
  <!-- child's arm reaching to the blocks -->
  <rect x="472" y="424" width="72" height="22" rx="11" fill="#D9A441" transform="rotate(-12 472 424)"/>
  <circle cx="476" cy="436" r="11" fill="#C68B62"/>
  <!-- head -->
  <circle cx="574" cy="352" r="34" fill="#C68B62"/>
  <path d="M540 352 a34 34 0 0 1 68 0 Z" fill="#2E2620"/>
  <path d="M572 318 q2 -10 10 -12" stroke="#2E2620" stroke-width="7" stroke-linecap="round" fill="none"/>
  <circle cx="562" cy="354" r="4" fill="#23201C"/>
  <circle cx="545" cy="354" r="4" fill="#23201C"/>
  <path d="M546 368 q8 7 16 0" stroke="#23201C" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- blocks and picture card between them -->
  <rect x="440" y="462" width="26" height="26" rx="4" fill="#264B5D" transform="rotate(-8 440 462)"/>
  <rect x="470" y="466" width="26" height="26" rx="4" fill="#C9764F" transform="rotate(6 470 466)"/>
  <rect x="455" y="440" width="26" height="26" rx="4" fill="#D9A441" transform="rotate(3 455 440)"/>
  <g transform="rotate(-6 508 492)">
    <rect x="496" y="482" width="48" height="36" rx="5" fill="#ffffff" stroke="#DCE6EA" stroke-width="3"/>
    <circle cx="520" cy="500" r="9" fill="#3E6B80"/>
  </g>
</svg>
